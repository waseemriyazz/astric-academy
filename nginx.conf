events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Server
    server {
        listen 10000;
        server_name _;
        root /var/www/html/public;

        index index.php index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header X-XSS-Protection "1; mode=block";

        # Favicon
        location = /favicon.ico {
            log_not_found off;
            access_log off;
        }

        # Robots
        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        # Static assets
        location ~* \.(jpg|jpeg|gif|png|css|js|ico|webp|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            log_not_found off;
            access_log off;
        }

        # Deny access to storage and other sensitive directories
        location ~ ^/(storage/app/public|storage/framework|storage/logs|bootstrap/cache) {
            deny all;
            log_not_found off;
            access_log off;
        }

        # Deny access to composer, artisan, and other sensitive files
        location ~ (composer\.json|composer\.lock|artisan|\.env|\.git|package\.json|package-lock\.json|webpack\.mix\.js|yarn\.lock)$ {
            deny all;
            log_not_found off;
            access_log off;
        }

        # Main location block
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            include fastcgi_params;

            fastcgi_buffer_size 128k;
            fastcgi_buffers 4 256k;
            fastcgi_busy_buffers_size 256k;
            fastcgi_read_timeout 300;
        }
    }
}